{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-error">
                    <strong>Nombre de usuario o contraseña incorrectos.</strong>
                    <p>Por favor, intenta de nuevo.</p>
                </div>
            {% endif %}
            
            <div class="form-group">
                <label for="id_username">Nombre de usuario:</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
        </form>

        <div class="auth-links">
            <p>¿No tienes cuenta? <a href="{% url 'register' %}">Crea una aquí</a></p>
        </div>
    </div>
</div>

<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        padding: 2rem 0;
    }

    .auth-card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }

    .auth-card h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #333;
    }

    .auth-form {
        margin-bottom: 1.5rem;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
        color: #333;
    }

    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
    }

    .btn-full {
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
    }

    .auth-links {
        text-align: center;
        border-top: 1px solid #eee;
        padding-top: 1rem;
    }

    .auth-links a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }
    
    .auth-links a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
