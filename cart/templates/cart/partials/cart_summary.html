<!-- cart/templates/cart/partials/cart_summary.html -->
<div class="cart-summary" id="cart-summary" data-cart-total="{{ cart.get_total_with_discount }}">
    <div class="summary-details">
        <h3>📊 Resumen del Pedido</h3>

        <div class="summary-line">
            <span>Subtotal:</span>
            <span id="cart-subtotal">${{ cart.get_total_price }}</span>
        </div>

        {% if cart.has_discount %}
        <div class="summary-line discount">
            <span>Descuento ({{ cart.get_coupon.code }}):</span>
            <span class="discount-amount" id="cart-discount">- ${{ cart.get_discount_amount }}</span>
        </div>
        {% else %}
        <div class="summary-line discount" style="display: none;">
            <span>Descuento:</span>
            <span class="discount-amount" id="cart-discount">- $0.00</span>
        </div>
        {% endif %}

        <div class="summary-line total">
            <span><strong>Total:</strong></span>
            <span><strong class="text-success" id="cart-total">${{ cart.get_total_with_discount }}</strong></span>
        </div>
    </div>
</div>

<script>
// Función para actualizar precios dinámicamente
function updateCartPrices(subtotal, discount, total) {
    const subtotalEl = document.getElementById('cart-subtotal');
    const discountEl = document.getElementById('cart-discount');
    const totalEl = document.getElementById('cart-total');
    const discountLine = document.querySelector('.summary-line.discount');

    if (subtotalEl) subtotalEl.textContent = `$${subtotal}`;
    if (totalEl) totalEl.textContent = `$${total}`;

    if (discount > 0) {
        if (discountEl) discountEl.textContent = `- $${discount}`;
        if (discountLine) discountLine.style.display = 'flex';
    } else {
        if (discountLine) discountLine.style.display = 'none';
    }

    console.log("💰 Precios actualizados:", { subtotal, discount, total });
}

// Escuchar eventos de actualización
document.addEventListener('cart:updated', function(event) {
    if (event.detail && event.detail.prices) {
        updateCartPrices(
            event.detail.prices.subtotal,
            event.detail.prices.discount,
            event.detail.prices.total
        );
    }
});
</script>
